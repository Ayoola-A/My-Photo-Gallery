<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Photo Gallery</title>
<link rel="stylesheet" href="gallery.css">
</head>
<body>

<h1>My Photo Gallery</h1>
<div class="gallery">
  <div class="tile">
    <img src="images/sunset.jpeg" alt="My photo 1">
    <div class="info"><h3>Sunset</h3><p>Beautiful sunset</p></div>
  </div>
  <div class="tile">
    <img src="images/nature.jpeg" alt="My photo 2">
    <div class="info"><h3>Nature</h3><p>Green forest</p></div>
  </div>
  <div class="tile">
    <img src="images/beach.jpeg" alt="My photo 3">
    <div class="info"><h3>Beach</h3><p>Ocean breeze</p></div>
  </div>
  <div class="tile">
    <img src="images/city.jpeg" alt="My photo 4">
    <div class="info"><h3>City</h3><p>Urban life</p></div>
  </div>
  <div class="tile">
    <img src="images/flowers.jpeg" alt="My photo 5">
    <div class="info"><h3>Flowers</h3><p>Spring bloom</p></div>
  </div>
  <div class="tile">
    <img src="images/mountains.jpeg" alt="My photo 6">
    <div class="info"><h3>Mountains</h3><p>High peaks</p></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
